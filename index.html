<!DOCTYPE html>
<html lang="en">

<head> 
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MLP FilmRoll Pro</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <header>
    <div class="logo">📷 <span class="highlight">MLP FilmRoll Pro</span></div>
    <div class="cart-btn" onclick="toggleCart()">🛒 Cart <span id="cart-count">0</span></div>
  </header>


  <section class="hero">
    <h1>Premium Film Rolls</h1>
    <p>Welcome to MLP FilmRoll Pro — Have fun finding your perfect film roll! 🎞️</p>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search by brand or ISO...">
      <button onclick="searchProducts()">Search</button>
    </div>

  </section>


  <main>
    <h2>Our Film Collection</h2>
    <div class="product-list" id="product-list"></div>
  </main>


  <div class="cart-panel" id="cart-panel">
    <h3>Shopping Cart</h3>
    <ul id="cart-items"></ul>
    <p class="total">Total: $<span id="cart-total">0.00</span></p>
    
    <button class="checkout-btn">Checkout</button>
    <span class="close-btn" onclick="toggleCart()">×</span>
  </div>

  <script src="script.js"></script>

</body>

</html>
